name: Publish AUR package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Secrets are only exposed to runs started from the protected default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: aur-publish
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build source archive and AUR files
        run: scripts/build-dist.sh --skip-deb --skip-rpm

      - name: Configure AUR deploy key
        env:
          AUR_DEPLOY_KEY_B64: ${{ secrets.AUR_DEPLOY_KEY_B64 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$AUR_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          cat >> ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF

      - name: Publish package metadata
        env:
          GIT_AUTHOR_NAME: Xynrin
          GIT_AUTHOR_EMAIL: xynrin@163.com
        run: bash scripts/publish-aur.sh
