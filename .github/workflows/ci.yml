name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Release metadata
        run: make release-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Vulnerability scan
        run: |
          version="v1.7.0"
          go install "golang.org/x/vuln/cmd/govulncheck@${version}"
          govulncheck ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, loong64, riscv64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build linux/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/yxxbc/spark-store-tui/internal/version.Version=$(cat VERSION)" \
            -o "sparkstore-linux-${{ matrix.goarch }}" ./cmd/sparkstore

  dist-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build every artifact
        run: scripts/build-dist.sh
      - name: Inspect artifacts
        run: |
          for file in dist/*.deb; do dpkg-deb -I "$file"; done
          for file in dist/*.rpm; do rpm -qip "$file"; done
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
