name: Mirror source

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check mirror credentials
        id: mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_GROUP: ${{ secrets.CNB_GROUP }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$CNB_TOKEN" ] || [ -z "$CNB_GROUP" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Gitee/CNB secrets are not configured; skipping mirror."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to Gitee and CNB
        if: steps.mirror.outputs.enabled == 'true'
        env:
          GITEE_OWNER: spark-store-project
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_GROUP: ${{ secrets.CNB_GROUP }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          npx --yes repo-all-sync@0.2.1 doctor
          npx --yes repo-all-sync@0.2.1 push
