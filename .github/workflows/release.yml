name: Release Linux packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Verify version
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION ($version) does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          scripts/check-version.sh
      - name: Build Debian, RPM and source artifacts
        run: scripts/build-dist.sh
      - name: Inspect artifacts
        run: |
          for file in dist/*.deb; do dpkg-deb -I "$file"; done
          for file in dist/*.rpm; do rpm -qip "$file"; done
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "spark-store-tui $tag" \
              --notes-file RELEASE_NOTES.md
          fi

  publish-mirrors:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check mirror credentials
        id: mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_GROUP: ${{ secrets.CNB_GROUP }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$CNB_TOKEN" ] || [ -z "$CNB_GROUP" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Gitee/CNB secrets are not configured; skipping mirror publish."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mirror source and publish Gitee + CNB releases
        if: steps.mirror.outputs.enabled == 'true'
        env:
          GITEE_OWNER: spark-store-project
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_GROUP: ${{ secrets.CNB_GROUP }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          npx --yes repo-all-sync@0.2.1 doctor
          npx --yes repo-all-sync@0.2.1 push
          npx --yes repo-all-sync@0.2.1 release \
            --version "$(cat VERSION)" \
            --assets dist \
            --notes RELEASE_NOTES.md
